name: database-tests

# R41: tests against a real SQL Server 2022 in Docker (Testcontainers starts it; the runner has Docker). Made-up data
# only. Runs beside ci, so the normal check is not slower, and only when a pull request touches the database or the
# queries; start it by hand from the Actions tab for anything else. deploy-test does not run it.
on:
  pull_request:
    paths:
      - 'RS.EF/**'
      - 'RS.COMMON/Entities/**'
      - 'RS.MVC/Features/**'
      - 'RS.DatabaseTests/**'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Database tests
        run: dotnet test RS.DatabaseTests/RS.DatabaseTests.csproj -c Release
