# A local SQL Server for running the app on your machine (F11): see "Local database" in README.md.
#   docker compose up -d     start (the data stays in a Docker volume)
#   docker compose down      stop
# The password only protects this local container; set LOCAL_SQL_PASSWORD to choose your own.
services:
  sql:
    # SQL Server 2022, the image CI will also use (R41). It is Intel-only: on Apple silicon it runs through
    # Rosetta (Docker Desktop → Settings → General → "Use Rosetta for x86_64/amd64 emulation on Apple Silicon").
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${LOCAL_SQL_PASSWORD:-Local-dev-only-1}"
      MSSQL_COLLATION: Turkish_CI_AS
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  sql-data:
